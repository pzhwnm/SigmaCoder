[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sigmacoder"
version = "0.1.0"
description = "本地优先、证据驱动的 Coding Agent Harness"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
sigma = "sigmacoder.cli:main"

[dependency-groups]
dev = [
  "pytest",
  "pytest-cov",
  "jsonschema",
  "hypothesis",
  "mypy",
  "ruff",
  "diff-cover",
  "mutmut>=3,<4",
  "pytest-randomly",
  "pip-audit",
  "pip-licenses",
  "detect-secrets",
]

[tool.uv]
required-version = "==0.12.5"

[tool.hatch.build.targets.wheel]
packages = ["src/sigmacoder"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]
pythonpath = ["src"]
xfail_strict = true

[tool.coverage.run]
branch = true
relative_files = true
source = ["sigmacoder"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.mypy]
python_version = "3.12"
mypy_path = ["src"]
strict = true
warn_unused_configs = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 8
